<!-- No Google Fonts on purpose: iOS ships SF Pro Rounded (ui-rounded), which works offline
     and means zero external requests. Nunito/Quicksand are only fallbacks if installed. -->
<style>
/* =========================================================
   1. DESIGN TOKENS
   ========================================================= */
:root{
  --pink:#F8D7E3; --blue:#CFE3F5; --purple:#9B7EDE; --purple-ink:#6B4FB8;
  --burgundy:#7A1F3D; --navy:#1E2A4A; --orange:#F4A259;
  --bg:#FBF8F6; --card:#FFFFFF; --lav:#E6DCF7; --muted:#646C88;
  --cycle-bg:#FBEEF2; --line:#E4E7F0;
  --radius:18px;
  --shadow:0 6px 20px rgba(30,42,74,.07),0 1px 3px rgba(30,42,74,.06);
  --grad:linear-gradient(135deg,#F8D7E3 0%,#E6DCF7 52%,#CFE3F5 100%);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tabh:64px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
}

/* =========================================================
   2. BASE
   ========================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.4;
  overflow-x:hidden;min-height:100vh;padding-bottom:calc(var(--tabh) + var(--sab) + 28px);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea{font:inherit;font-size:16px;color:var(--navy);-webkit-user-select:text;user-select:text}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke:none}
.muted{color:var(--muted)}
.ut{overflow-wrap:anywhere;word-break:break-word}  /* user text */
#view{padding:0 16px}
#view.enter{animation:enter .32s ease both}
section{margin-top:24px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;gap:8px}
.sec-head h2{font-size:18px;font-weight:800}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}

/* =========================================================
   3. HEADERS
   ========================================================= */
.hero{background:var(--grad);margin:0 -16px;padding:calc(var(--sat) + 8px) 18px 20px;border-radius:0 0 28px 28px;position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:2px}
.hero-text{flex:1;min-width:0;padding-bottom:4px}
.hero h1{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.hero .date{margin-top:6px;color:var(--muted);font-weight:700}
.hero-cat{width:96px;flex:none;position:relative}
.hero-cat .cat{width:96px;height:auto;transform-origin:50% 95%}
.hero-cat.wiggle .cat{animation:wiggle .7s ease}
.cat-bubble{position:absolute;right:78%;top:-4px;background:#fff;padding:9px 12px;border-radius:14px 14px 4px 14px;font-size:14px;
  font-weight:800;width:max-content;max-width:190px;box-shadow:var(--shadow);opacity:0;transform:translateY(6px) scale(.92);
  transition:opacity .25s,transform .25s;pointer-events:none;text-align:left;z-index:2}
.cat-bubble.show{opacity:1;transform:none}
.cycle-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);color:var(--burgundy);display:grid;place-items:center;
  position:relative;box-shadow:0 3px 12px rgba(122,31,61,.16)}
.cycle-btn .heart{position:absolute;right:6px;bottom:7px}
.cycle-btn .heart .i{width:11px;height:11px}
.cycle-line{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.65);color:var(--burgundy);
  font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;min-height:34px;text-align:left}
.cycle-line .i{width:15px;height:15px}
.page-head{background:var(--grad);margin:0 -16px 16px;padding:calc(var(--sat) + 20px) 20px 18px;border-radius:0 0 26px 26px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.page-head .sub{color:var(--muted);font-weight:700;font-size:14px;margin-top:2px}

/* =========================================================
   4. BUTTONS, FIELDS, CONTROLS
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:14px;
  background:var(--navy);color:#fff;font-weight:800;font-size:16px;transition:transform .12s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn .i{width:20px;height:20px}
.btn.ghost{background:rgba(30,42,74,.07);color:var(--navy)}
.btn.danger{color:var(--burgundy)} .btn.ghost.danger{background:rgba(122,31,61,.09)}
.btn.danger-fill{background:var(--burgundy);color:#fff}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--navy);flex:none}
.icon-btn.soft{background:rgba(255,255,255,.7)}
.icon-btn.ghost{color:#9AA1B8}
.link{color:var(--purple-ink);font-weight:800;min-height:44px;padding:0 6px;font-size:15px}
.add-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:16px;margin:4px 0 12px;
  border:2px dashed #D3C6F0;color:var(--purple-ink);font-weight:800;background:rgba(155,126,222,.06)}
.field{display:block;margin-top:14px}
.field>span{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.field>span em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--purple-ink)}
.field input,.field textarea,.input{display:block;width:100%;border:1.5px solid var(--line);background:#FAFBFD;border-radius:14px;padding:12px 14px;
  min-height:50px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.field textarea{resize:none;min-height:110px;line-height:1.45}
.field input:focus,.field textarea:focus,.input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(155,126,222,.18);background:#fff}
input[type=date]{text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.err{border-color:var(--burgundy)!important;animation:shake .35s}
.sheet-label{font-size:12px;font-weight:800;color:var(--muted);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;background:rgba(30,42,74,.07);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted);text-align:center;transition:background .2s,color .2s}
.seg button.sel{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(30,42,74,.1)}
.switch{-webkit-appearance:none;appearance:none;width:52px;height:32px;border-radius:16px;background:#D5D9E6;position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--purple)} .switch:checked::after{transform:translateX(20px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-weight:700}
.toggle-row small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;background:rgba(30,42,74,.07);font-weight:700;font-size:14px;transition:background .15s,color .15s}
.chip.sel{background:var(--burgundy);color:#fff}
.swatches{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(30,42,74,.14);transition:box-shadow .15s}
.sw.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--navy)}
.pill-pick{display:flex;gap:8px;flex-wrap:wrap}
.pp{min-height:40px;padding:0 14px;border-radius:20px;background:rgba(30,42,74,.06);font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp.sel{background:var(--c);color:var(--fg);box-shadow:0 0 0 2px var(--navy)}
.badge{display:inline-block;background:var(--c);color:var(--fg);font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;max-width:140px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}

/* =========================================================
   5. LISTS & ROWS
   ========================================================= */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:4px;background:#fff;border-radius:16px;padding:6px 4px 6px 4px;box-shadow:var(--shadow);
  transition:opacity .38s ease,transform .38s ease;position:relative;overflow:hidden}
.item.has-color{border-left:6px solid var(--c)}
.item.overdue{background:#FCEFF3;box-shadow:inset 0 0 0 1.5px rgba(122,31,61,.35),var(--shadow)}
.item.leaving{opacity:0;transform:translateX(36px)}
.item.is-done .item-title{text-decoration:line-through;color:var(--muted)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;min-height:48px;justify-content:center;padding:4px 2px}
.item-title{font-weight:700;overflow-wrap:anywhere}
.item-sub{font-size:13px;color:var(--muted);font-weight:700}
.item-sub.od{color:var(--burgundy)}
.item-desc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{width:44px;height:44px;display:grid;place-items:center;flex:none}
.check span{width:28px;height:28px;border-radius:50%;border:2.5px solid #C5CBDF;display:grid;place-items:center;transition:background .2s,border-color .2s}
.check .i{width:15px;height:15px;color:#fff;opacity:0;transform:scale(.3);transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.check.on span{background:var(--purple);border-color:var(--purple)}
.check.on .i{opacity:1;transform:scale(1)}
.check.pop span{animation:pop .42s ease}
.more{display:block;width:100%;text-align:center;color:var(--purple-ink);font-weight:800;min-height:44px}
.note-row{display:block;width:100%;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;text-align:left}
.nr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nr-top b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-row p{color:var(--muted);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nr-date{display:block;font-size:12px;color:#9AA1B8;font-weight:700;margin-top:6px}
.hint{font-size:13px;color:var(--muted);font-weight:700;margin:0 4px 8px}

/* Empty states (sleeping cat) */
.empty{text-align:center;padding:14px 16px 6px;color:var(--muted);font-weight:700}
.empty .cat{width:150px;margin:0 auto 6px}
.empty.small .cat{width:112px}
.empty p{font-size:15px}

/* =========================================================
   6. DASHBOARD
   ========================================================= */
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.class-card{background:var(--c);color:var(--fg);border-radius:20px;padding:14px;box-shadow:var(--shadow);min-height:112px;
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s;text-align:left;min-width:0}
.class-card:active{transform:scale(.97)}
.cc-name{font-weight:800;font-size:16px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;min-width:0}
.cc-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:10px}
.cc-stats{font-size:13px;font-weight:800;opacity:.85;line-height:1.25}
.ring{flex:none}
.nudge{display:flex;align-items:center;gap:10px;margin-top:16px;background:#FFF4E6;box-shadow:inset 0 0 0 1.5px rgba(244,162,89,.5)}
.nudge .cat{width:50px;flex:none}
.nudge-text{flex:1;font-size:14px;display:flex;flex-direction:column;gap:1px}
.note-preview{display:block;width:100%;text-align:left}
.note-preview p{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

/* =========================================================
   7. TO-DO
   ========================================================= */
.add-todo{padding:12px}
.add-row{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.date-pill{position:relative;flex:1;min-width:0;display:flex;align-items:center;border:1.5px solid var(--line);background:#FAFBFD;border-radius:14px;min-height:48px;padding-left:12px;color:var(--muted)}
.date-pill .i{width:18px;height:18px;flex:none}
.date-pill input{position:absolute;inset:0;width:100%;height:100%;opacity:0;-webkit-appearance:none;appearance:none;border:0;background:transparent}
.date-pill .date-ph{padding-left:8px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-pill.filled{color:var(--navy);border-color:#CFC2EE;background:#F6F2FD}
.date-clear{position:relative;z-index:2;margin-left:auto;width:40px;height:44px;display:none;place-items:center;color:var(--muted)}
.date-pill.filled .date-clear{display:grid}
.done-head{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
.done-toggle{display:flex;align-items:center;gap:4px;font-weight:800;font-size:17px;min-height:44px}
.done-toggle .i{transition:transform .2s;width:18px;height:18px}
.done-toggle.open .i{transform:rotate(90deg)}

/* =========================================================
   8. CALENDAR (shared by main + cycle calendars)
   ========================================================= */
.cal-card{padding:12px 10px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-title{font-weight:800;font-size:18px;text-align:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:800;color:var(--muted);margin:6px 0 4px}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-days.anim-next{animation:slideL .28s ease}
.cal-days.anim-prev{animation:slideR .28s ease}
.day{min-height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px;position:relative;transition:background .15s}
.day.blank{pointer-events:none}
.day.today{box-shadow:inset 0 0 0 2px var(--purple)}
.day.today span{color:var(--purple-ink);font-weight:900}
.day.sel{background:var(--pink)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px rgba(30,42,74,.28);display:block}
.dot.note{background:var(--navy);box-shadow:none}
.day:not(.has-note) .dot.note{display:none}
.day-detail h3{font-size:18px;font-weight:800}
.sub-head{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.sub-head h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.nothing{color:var(--muted);font-weight:700;font-size:14px;padding:4px 2px}

/* =========================================================
   9. CLASSES
   ========================================================= */
.class-tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.class-tabs::-webkit-scrollbar{display:none}
.ctab{flex:none;min-height:42px;padding:0 16px;border-radius:21px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:14px;
  max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:2px solid transparent;transition:background .2s,color .2s}
.ctab .cdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;box-shadow:0 0 0 1px rgba(30,42,74,.2);vertical-align:0}
.ctab.active{background:var(--c);color:var(--fg);border-color:rgba(30,42,74,.12)}
.ctab.active .cdot{display:none}
.class-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c);color:var(--fg);border-radius:22px;padding:16px 18px;margin:12px 0 14px;box-shadow:var(--shadow)}
.class-banner h2{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.class-banner p{font-weight:700;opacity:.85;margin-top:2px}
.sub-seg{margin-bottom:14px}

/* =========================================================
   10. NOTES
   ========================================================= */
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:0 14px;min-height:50px;margin-bottom:14px;color:var(--muted)}
.search input{flex:1;border:0;outline:none;background:transparent;min-height:48px;-webkit-appearance:none;appearance:none;min-width:0}
.editor{display:flex;flex-direction:column;background:#fff}
.ed-title{border:0;font-size:24px;font-weight:800;padding:8px 4px;outline:none;background:transparent;width:100%;-webkit-appearance:none}
.ed-body{flex:1;border:0;outline:none;resize:none;font-size:17px;line-height:1.55;padding:4px;background:transparent;min-height:240px;width:100%}
.ed-meta{font-size:12px;color:#9AA1B8;font-weight:700;padding:8px 4px}

/* =========================================================
   11. TAB BAR
   ========================================================= */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);padding:6px 6px calc(6px + var(--sab));display:grid;
  grid-template-columns:repeat(5,1fr);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(30,42,74,.18)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.58);font-size:11px;font-weight:800;min-height:52px;transition:color .2s;text-align:center}
.tab-ic{width:50px;height:30px;display:grid;place-items:center;border-radius:15px;transition:background .25s}
.tab.active{color:#fff}
.tab.active .tab-ic{background:rgba(248,215,227,.22)}

/* =========================================================
   12. OVERLAYS (cycle, settings, note editor), SHEETS, MODALS
   ========================================================= */
.overlay{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:60;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(28px + var(--sab));
  transform:translateX(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s}
.overlay.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.overlay.from-bottom{transform:translateY(100%);z-index:70}
.overlay.from-bottom.open{transform:none}
.cycle-ov{background:var(--cycle-bg)}
.ov-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;margin:0 -16px;padding:calc(var(--sat) + 6px) 8px 6px;background:inherit}
.back-btn{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;font-weight:800;color:var(--navy)}
.cycle-ov .back-btn{color:var(--burgundy)}
.ov-title{font-weight:800;font-size:17px}
.spacer{width:80px}
.set-sec{margin-top:16px}
.set-sec h3{font-size:17px;font-weight:800;margin-bottom:6px}
.set-sec p{font-size:14px;color:var(--muted);font-weight:600}
.set-class{padding:12px 0;border-bottom:1px solid var(--line)}
.set-class:last-child{border-bottom:0}
.foot{text-align:center;color:#9AA1B8;font-weight:700;font-size:13px;margin:24px 0 8px}

#sheetWrap{position:fixed;inset:0;z-index:80;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(30,42,74,.35);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);max-height:calc(var(--vvh,100vh) - 24px);overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;background:#fff;border-radius:26px 26px 0 0;padding:8px 20px calc(20px + var(--sab));transform:translateY(105%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(30,42,74,.2)}
#sheetWrap.open{pointer-events:auto}
#sheetWrap.open .sheet-backdrop{opacity:1}
#sheetWrap.open .sheet{transform:none}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:#DDE1EC;margin:4px auto 12px}
.sheet h3{font-size:21px;font-weight:800}
.sheet-actions{display:flex;gap:10px;margin-top:22px}
.sheet-actions .btn{flex:1}

#confirm{position:fixed;inset:0;z-index:90;background:rgba(30,42,74,.4);display:none;align-items:center;justify-content:center;padding:24px}
#confirm.open{display:flex;animation:enter .2s ease}
.cf-box{background:#fff;border-radius:24px;padding:22px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(30,42,74,.25)}
.cf-box h3{font-size:19px;font-weight:800}
.cf-box p{color:var(--muted);margin-top:8px;font-weight:600}
.cf-actions{display:flex;gap:10px;margin-top:20px}
.cf-actions .btn{flex:1;padding:0 10px}

#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + var(--sab) + 14px);z-index:92;margin:0 auto;max-width:420px;background:var(--navy);color:#fff;
  border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:15px;
  box-shadow:0 10px 30px rgba(30,42,74,.3);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast button{color:var(--pink);font-weight:900;min-height:36px;padding:0 8px;flex:none}

/* Onboarding */
#onboard{position:fixed;inset:0;z-index:75;background:var(--grad);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
  padding:calc(var(--sat) + 24px) 18px calc(var(--sab) + 28px)}
#onboard.open{display:block}
.ob-inner{max-width:460px;margin:0 auto}
.ob-cat{width:150px;margin:0 auto}
#onboard h1{text-align:center;font-size:30px;font-weight:900;margin-top:4px}
.ob-sub{text-align:center;font-size:18px;font-weight:700;color:var(--muted);margin:4px 0 18px}
.ob-card h3{font-size:17px;font-weight:800}
.ob-row{padding:12px 0;border-bottom:1px solid var(--line)}
.ob-row:last-child{border-bottom:0}
.center{display:block;margin:10px auto 0;text-align:center}

/* =========================================================
   13. CYCLE TRACKER
   ========================================================= */
.cy-illu{width:210px;margin:0 auto -6px}
.cy-status{text-align:center}
.cy-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--burgundy);opacity:.8}
.cy-big{font-size:34px;font-weight:900;color:var(--burgundy);line-height:1.1}
.cy-next{font-weight:700;margin-top:6px}
.cy-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cy-stats div{background:var(--cycle-bg);border-radius:14px;padding:10px}
.cy-stats b{display:block;font-size:18px;font-weight:900;color:var(--burgundy)}
.cy-stats span{font-size:12px;font-weight:800;color:var(--muted)}
.est{font-style:normal;display:inline-block;font-size:10px;font-weight:900;background:var(--burgundy);color:#fff;border-radius:6px;padding:1px 5px;margin-left:3px;text-transform:uppercase;letter-spacing:.04em}
.cy-note{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.cday.flow-light{background:#F7CFDC}
.cday.flow-medium{background:#E58AA7;color:#fff}
.cday.flow-heavy{background:var(--burgundy);color:#fff}
.cday.flow-medium span,.cday.flow-heavy span{color:#fff!important}
.cday.pred{background:rgba(248,215,227,.55);outline:1.5px dashed #D98AA6;outline-offset:-4px}
.cday.future:not(.pred){color:#A9AFC4}
.dot.sym{background:var(--purple);box-shadow:none}
.cday.flow-heavy .dot.sym,.cday.flow-medium .dot.sym{background:#fff}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;font-weight:800;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:4px;display:inline-block}
.lg.flow{background:#E58AA7} .lg.pred{background:rgba(248,215,227,.8);outline:1.5px dashed #D98AA6;outline-offset:-2px}
.seg.flow button.sel[data-flow=light]{background:#F7CFDC}
.seg.flow button.sel[data-flow=medium]{background:#E58AA7;color:#fff}
.seg.flow button.sel[data-flow=heavy]{background:var(--burgundy);color:#fff}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{min-height:58px;border-radius:14px;background:rgba(30,42,74,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;text-align:center}
.mood b{font-size:22px;line-height:1.1}
.mood.sel{background:var(--pink);box-shadow:inset 0 0 0 2px var(--burgundy)}
.hist{padding:12px 16px}
.hist-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hist-len{font-size:13px;font-weight:800;color:var(--burgundy);white-space:nowrap}
.hist-sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:22px 12px 0;font-weight:600}

/* =========================================================
   14. CAT MASCOT, POP-UP, CELEBRATION
   ========================================================= */
.cat-sit .cat-eyes{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.cat-wave .wave-arm{transform-origin:84px 106px;animation:wave 1.1s ease-in-out infinite}
.cat-cheer .arm-l{transform-origin:36px 106px;animation:cheerL .9s ease-in-out infinite}
.cat-cheer .arm-r{transform-origin:84px 106px;animation:cheerR .9s ease-in-out infinite}
.zzz text{animation:zzz 2.4s ease-in-out infinite}
.zzz text:nth-child(2){animation-delay:.4s} .zzz text:nth-child(3){animation-delay:.8s}
#catPop{position:fixed;left:50%;bottom:0;z-index:95;width:140px;transform:translate(-50%,120%);transition:transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
#catPop.show{transform:translate(-50%,14%)}
#catPop .cat{width:140px}
.pop-bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:var(--navy);font-weight:900;padding:10px 14px;
  border-radius:16px;white-space:nowrap;box-shadow:0 8px 24px rgba(30,42,74,.18);margin-bottom:2px;font-size:15px}
.pop-bubble::after{content:'';position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
#celebrate{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(251,248,246,.84);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden;padding:24px}
#celebrate.show{display:flex;animation:enter .3s ease}
.confetti{position:absolute;top:-30px;width:10px;height:14px;border-radius:3px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
.confetti.paw{background:none!important;width:24px;height:24px}
.confetti.paw .i{width:24px;height:24px}
.cel-card{position:relative;text-align:center;background:#fff;border-radius:28px;padding:18px 22px 22px;box-shadow:0 20px 50px rgba(30,42,74,.18);max-width:320px;width:100%}
.cel-card .cat{width:160px;margin:0 auto}
.cel-card h2{font-size:24px;font-weight:900;margin-top:4px}
.cel-card p{color:var(--muted);font-weight:700;margin:6px 0 14px}

/* =========================================================
   15. ANIMATIONS
   ========================================================= */
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
@keyframes cheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes cheerR{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes zzz{0%,100%{opacity:.25;transform:translateY(3px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(115vh) rotate(var(--r))}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
'use strict';
/* =========================================================
   0. CONSTANTS
   ========================================================= */
const NAME = 'Ari';
const PREFIX = 'studyapp_';                 // every localStorage key is namespaced
const KEYS = ['classes','assignments','todos','notes','dayNotes','cycle','settings'];
const PALETTE = [
  {hex:'#F8D7E3',name:'Pink'},{hex:'#CFE3F5',name:'Blue'},{hex:'#9B7EDE',name:'Purple'},
  {hex:'#F4A259',name:'Orange'},{hex:'#7A1F3D',name:'Burgundy'},{hex:'#1E2A4A',name:'Navy'}];
const DEFAULT_CLASS_COLORS = ['#F8D7E3','#CFE3F5','#9B7EDE','#F4A259'];
const FLOWS = ['light','medium','heavy'];
const SYMPTOMS = [['cramps','Cramps'],['headache','Headache'],['bloating','Bloating'],['fatigue','Fatigue'],
  ['mood_swings','Mood swings'],['acne','Acne'],['back_pain','Back pain'],['tender_breasts','Tender breasts'],
  ['cravings','Cravings'],['nausea','Nausea']];
const SYM_IDS = SYMPTOMS.map(s=>s[0]);
const SYM_LABEL = Object.fromEntries(SYMPTOMS);
const MOODS = [['happy','😊','Happy'],['calm','😌','Calm'],['meh','😐','Meh'],['sad','😢','Sad'],['irritable','😤','Irritable'],['anxious','😰','Anxious']];
const DEFAULT_CYCLE = 28, DEFAULT_PERIOD = 5;
const BACKUP_NUDGE_DAYS = 14;
const POP_LINES = ['Purrfect, Ari!','Nailed it!','Meow-velous!'];
const ENCOURAGE = ["You've got this, Ari! 💪","Proud of you 🧡","One step at a time 🐾","Drink some water, Ari 💧",
  "You're doing amazing ✨","Take a little break, you earned it ☕","Smart AND cute? Unfair. 😼","Future Ari says thank you 🎓"];

/* =========================================================
   1. SMALL HELPERS
   ========================================================= */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
const avg = a=>a.reduce((x,y)=>x+y,0)/a.length;
const plural = (n,w)=>`${n} ${w}${n===1?'':'s'}`;
const cmp = (a,b)=>a<b?-1:a>b?1:0;

/** Readable text colour (navy or white) on a given background hex. */
function textOn(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#1E2A4A';
  const n=parseInt(m[1],16), r=n>>16, g=(n>>8)&255, b=n&255;
  return (0.299*r+0.587*g+0.114*b)/255 > 0.62 ? '#1E2A4A' : '#FFFFFF';
}

/* =========================================================
   2. DATE UTILITIES — always LOCAL dates as "YYYY-MM-DD".
   Never new Date("YYYY-MM-DD") (that parses as UTC midnight).
   Day arithmetic goes through Date.UTC so DST can't shift a day.
   ========================================================= */
const pad = n=>String(n).padStart(2,'0');
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dayNum(s){ const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); }
function fromDayNum(n){ const d=new Date(n*864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function addDays(s,k){ return fromDayNum(dayNum(s)+k); }
function diffDays(a,b){ return dayNum(a)-dayNum(b); }           // a minus b, in days
function isValidYmd(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fromDayNum(dayNum(s))===s; }
function fmtDate(s,opts){ try{ return parseYmd(s).toLocaleDateString('en-US',opts); }catch(e){ return s; } }
const LONG = {weekday:'long',month:'long',day:'numeric'};
function shortDate(s){ const o={month:'short',day:'numeric'}; if(s.slice(0,4)!==todayStr().slice(0,4)) o.year='numeric'; return fmtDate(s,o); }
function dueLabel(s){
  if(!s) return '';
  const d=diffDays(s,todayStr());
  if(d<0) return `Overdue · ${plural(-d,'day')}`;
  if(d===0) return 'Due today';
  if(d===1) return 'Due tomorrow';
  if(d<7) return `Due ${fmtDate(s,{weekday:'long'})}`;
  return `Due ${shortDate(s)}`;
}
function relTime(ts){
  const d=new Date(ts), ds=ymd(d), diff=diffDays(todayStr(),ds);
  const time=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(diff===0) return `Today, ${time}`;
  if(diff===1) return `Yesterday, ${time}`;
  return shortDate(ds);
}
function monthLabel(y,m){ return new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
/** Cells for a month grid: date strings, with null for leading/trailing blanks. */
function monthCells(y,m){
  const off=(new Date(y,m,1).getDay()-S.settings.weekStart+7)%7;
  const dim=new Date(y,m+1,0).getDate(), cells=[];
  for(let i=0;i<off;i++) cells.push(null);
  for(let d=1;d<=dim;d++) cells.push(`${y}-${pad(m+1)}-${pad(d)}`);
  while(cells.length%7) cells.push(null);
  return cells;
}
function weekdayHeader(){
  const n=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], ws=S.settings.weekStart;
  return `<div class="wk">${n.slice(ws).concat(n.slice(0,ws)).map(x=>`<span>${x}</span>`).join('')}</div>`;
}

/* =========================================================
   3. STORAGE — namespaced, try/catch everywhere, sanitised on load.
   Corrupted JSON never crashes the app; the raw text is kept under
   studyapp_corrupt_<key> so nothing is silently destroyed.
   ========================================================= */
function lsGet(key){ try{ return localStorage.getItem(PREFIX+key); }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(PREFIX+key,val); return true; }catch(e){ return false; } }

const str = (v,max=20000)=>typeof v==='string'?v.slice(0,max):'';
const arr = v=>Array.isArray(v)?v:[];
const obj = v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
const num = (v,d)=>(typeof v==='number'&&isFinite(v))?v:d;
const isObj = x=>x&&typeof x==='object'&&!Array.isArray(x);

/** Sanitisers: turn anything (missing, corrupted, old backup) into valid data. */
const SAN = {
  classes(v){
    const a=arr(v).filter(isObj).slice(0,4).map((c,i)=>({
      id:'c'+(i+1),
      name:str(c.name,40).trim()||('Class '+(i+1)),
      color:/^#[0-9a-f]{6}$/i.test(c.color)?c.color:DEFAULT_CLASS_COLORS[i]}));
    return a.length===4?a:[];
  },
  assignments(v){
    return arr(v).filter(x=>isObj(x)&&typeof x.id==='string'&&typeof x.title==='string').map(x=>({
      id:x.id, classId:str(x.classId,10), title:str(x.title,200), due:isValidYmd(x.due)?x.due:'',
      desc:str(x.desc,5000), done:!!x.done, createdAt:num(x.createdAt,0)}));
  },
  todos(v){
    return arr(v).filter(x=>isObj(x)&&typeof x.id==='string'&&typeof x.text==='string').map(x=>({
      id:x.id, text:str(x.text,200), due:isValidYmd(x.due)?x.due:'', done:!!x.done,
      createdAt:num(x.createdAt,0), doneAt:num(x.doneAt,0)}));
  },
  notes(v){
    return arr(v).filter(x=>isObj(x)&&typeof x.id==='string').map(x=>({
      id:x.id, classId:typeof x.classId==='string'?x.classId:null, title:str(x.title,200), body:str(x.body,100000),
      createdAt:num(x.createdAt,0), updatedAt:num(x.updatedAt,num(x.createdAt,0))}));
  },
  dayNotes(v){
    const o=obj(v), out={};
    for(const k in o) if(isValidYmd(k)&&typeof o[k]==='string'&&o[k].trim()) out[k]=o[k].slice(0,20000);
    return out;
  },
  cycle(v){
    const o=obj(v), periods={}, logs={}, p=obj(o.periods), l=obj(o.logs);
    for(const k in p) if(isValidYmd(k)&&FLOWS.includes(p[k])) periods[k]=p[k];
    for(const k in l){
      if(!isValidYmd(k)) continue;
      const e=obj(l[k]);
      const symptoms=[...new Set(arr(e.symptoms).filter(s=>SYM_IDS.includes(s)))];
      const other=str(e.other,300), mood=MOODS.some(m=>m[0]===e.mood)?e.mood:'';
      if(symptoms.length||other.trim()||mood) logs[k]={symptoms,other,mood};
    }
    return {periods,logs};
  },
  settings(v){
    const o=obj(v);
    return {onboarded:!!o.onboarded, catAnimations:o.catAnimations!==false, weekStart:o.weekStart===0?0:1,
      lastBackup:isValidYmd(o.lastBackup)?o.lastBackup:null};
  }
};

function load(key){
  const raw=lsGet(key);
  if(raw==null) return SAN[key](undefined);
  try{ return SAN[key](JSON.parse(raw)); }
  catch(e){ lsSet('corrupt_'+key,raw); return SAN[key](undefined); }
}
let lastSaveWarn=0;
function save(key){
  let ok=false;
  try{ ok=lsSet(key,JSON.stringify(S[key])); }catch(e){ ok=false; }
  if(!ok && Date.now()-lastSaveWarn>8000){
    lastSaveWarn=Date.now();
    toast("Couldn't save — phone storage is blocked or full. Export a backup!");
  }
  return ok;
}

/* =========================================================
   4. STATE
   ========================================================= */
const S = {classes:[],assignments:[],todos:[],notes:[],dayNotes:{},cycle:{periods:{},logs:{}},settings:SAN.settings()};
const UI = {tab:'home', classId:null, classSub:'assign', calY:0, calM:0, calSel:'', calDir:'', cycY:0, cycM:0,
  doneOpen:false, search:'', greeting:null, greetAt:0, editing:null};

/** Debounced autosave with a flush-all (called on backgrounding, re-render, close). */
const pending=new Map();
function debounce(key,fn,ms=450){
  const p=pending.get(key); if(p) clearTimeout(p.t);
  pending.set(key,{t:setTimeout(()=>{ pending.delete(key); fn(); },ms),fn});
}
function flushAll(){
  const items=[...pending.values()]; pending.clear();
  items.forEach(p=>{ clearTimeout(p.t); try{ p.fn(); }catch(e){} });
}

/* =========================================================
   5. ICONS (inline SVG)
   ========================================================= */
const ic=(p,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  home:ic('<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V19a1 1 0 0 0 1 1H10v-5.5h4V20h3.5a1 1 0 0 0 1-1V9.5"/>'),
  todo:ic('<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="m8 12.2 2.8 2.8L16.2 9"/>'),
  cal:ic('<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  classes:ic('<path d="M4.5 19V5.5a2 2 0 0 1 2-2h13v14h-13a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/><path d="M9 7.5h6"/>'),
  notes:ic('<path d="M14 3.5H6.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V9z"/><path d="M14 3.5V9h5.5M8.5 13h7M8.5 16.5h4.5"/>'),
  moon:ic('<path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/>'),
  heart:ic('<path d="M12 20.5S4 15.6 4 9.8A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 8 2.4c0 5.8-8 10.7-8 10.7z"/>','fill'),
  settings:ic('<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>'),
  back:ic('<path d="M15 5.5 8.5 12l6.5 6.5"/>'),
  chevL:ic('<path d="M14.5 6 8.5 12l6 6"/>'),
  chevR:ic('<path d="m9.5 6 6 6-6 6"/>'),
  plus:ic('<path d="M12 5v14M5 12h14"/>'),
  trash:ic('<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/>'),
  search:ic('<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>'),
  x:ic('<path d="M6 6l12 12M18 6 6 18"/>'),
  paw:ic('<ellipse cx="12" cy="15.6" rx="5" ry="4.3"/><circle cx="6.3" cy="10.4" r="2.2"/><circle cx="9.9" cy="6.6" r="2.3"/><circle cx="14.1" cy="6.6" r="2.3"/><circle cx="17.7" cy="10.4" r="2.2"/>','fill'),
};

/* =========================================================
   6. CAT MASCOT (inline SVG, composed from parts)
   ========================================================= */
const CO='#F4A259', CD='#DD8436', CP='#F6A5BE', CN='#1E2A4A', CW='#FFF3E4';
function catHead(eyes='open',mouth='smile'){
  const E = eyes==='open'
    ? `<g class="cat-eyes"><ellipse cx="46" cy="58" rx="4.8" ry="6.2" fill="${CN}"/><ellipse cx="74" cy="58" rx="4.8" ry="6.2" fill="${CN}"/><circle cx="47.7" cy="55.6" r="1.8" fill="#fff"/><circle cx="75.7" cy="55.6" r="1.8" fill="#fff"/></g>`
    : eyes==='happy'
    ? `<path d="M41 60.5q5-7 10 0M69 60.5q5-7 10 0" fill="none" stroke="${CN}" stroke-width="2.8" stroke-linecap="round"/>`
    : `<path d="M41 58q5 5 10 0M69 58q5 5 10 0" fill="none" stroke="${CN}" stroke-width="2.6" stroke-linecap="round"/>`;
  const M = mouth==='open'
    ? `<path d="M54.5 71.5q5.5 10 11 0z" fill="#7A1F3D"/><path d="M57.2 75.3q2.8 2.6 5.6 0" fill="${CP}"/>`
    : `<path d="M60 70.6q-2.8 4-6 1.2M60 70.6q2.8 4 6 1.2" fill="none" stroke="${CN}" stroke-width="1.8" stroke-linecap="round"/>`;
  return `<g class="cat-head">
    <path d="M25 46 31 9l25 20z" fill="${CO}" stroke="${CO}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M95 46 89 9 64 29z" fill="${CO}" stroke="${CO}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M32.5 37.5 35.5 19l12.5 11z" fill="${CP}"/><path d="M87.5 37.5 84.5 19 72 30z" fill="${CP}"/>
    <ellipse cx="60" cy="60" rx="38" ry="32" fill="${CO}"/>
    <path d="M52 30.5q2 6 0 11M60 29v12M68 30.5q-2 6 0 11" stroke="${CD}" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="60" cy="73" rx="14.5" ry="10" fill="${CW}"/>
    <circle cx="36.5" cy="70" r="5.5" fill="${CP}" opacity=".6"/><circle cx="83.5" cy="70" r="5.5" fill="${CP}" opacity=".6"/>
    ${E}
    <path d="M56.8 66.4h6.4L60 70z" fill="${CP}" stroke="${CP}" stroke-width="1.4" stroke-linejoin="round"/>
    ${M}
    <path d="M30 70l-15-3M30 74.5l-15 1.5M90 70l15-3M90 74.5l15 1.5" stroke="${CN}" stroke-opacity=".32" stroke-width="1.5" stroke-linecap="round"/>
  </g>`;
}
function catBody(arms){
  const armR=`<g class="arm-r wave-arm"><path d="M84 106q16-8 20-30" stroke="${CO}" stroke-width="12" stroke-linecap="round" fill="none"/><circle cx="104" cy="74" r="8" fill="${CO}"/><circle cx="104" cy="74.5" r="3.2" fill="${CP}" opacity=".8"/></g>`;
  const armL=`<g class="arm-l"><path d="M36 106q-16-8-20-30" stroke="${CO}" stroke-width="12" stroke-linecap="round" fill="none"/><circle cx="16" cy="74" r="8" fill="${CO}"/><circle cx="16" cy="74.5" r="3.2" fill="${CP}" opacity=".8"/></g>`;
  return `<path d="M86 134q30 2 25-28q-3-11-11-6" fill="none" stroke="${CO}" stroke-width="9" stroke-linecap="round"/>
    <path d="M100 100q-8 2-6 9" fill="none" stroke="${CD}" stroke-width="3" stroke-linecap="round"/>
    ${arms==='wave'?armR:''}${arms==='cheer'?armL+armR:''}
    <ellipse cx="60" cy="112" rx="31" ry="30" fill="${CO}"/>
    <ellipse cx="60" cy="118" rx="17" ry="20" fill="${CW}"/>
    <ellipse cx="47" cy="140" rx="10" ry="6.5" fill="${CO}"/><ellipse cx="73" cy="140" rx="10" ry="6.5" fill="${CO}"/>
    <path d="M44 141v-3M50 141v-3M70 141v-3M76 141v-3" stroke="${CD}" stroke-width="1.6" stroke-linecap="round"/>`;
}
function catSleeping(){
  return `<path d="M152 82q16 24-24 25h-44" fill="none" stroke="${CO}" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="100" cy="76" rx="56" ry="29" fill="${CO}"/>
    <path d="M98 49q4 8 0 14M113 50q4 8 0 14M128 55q3 7 0 12" stroke="${CD}" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="60" cy="100" rx="11" ry="6.5" fill="${CO}"/>
    <g transform="translate(4 24) scale(.78)">${catHead('closed')}</g>`;
}
const zzz=`<g class="zzz" fill="#9B7EDE" font-weight="900" font-family="ui-rounded,system-ui,sans-serif"><text x="78" y="28" font-size="13">z</text><text x="89" y="18" font-size="11">z</text><text x="98" y="9" font-size="9">z</text></g>`;
const svgWrap=(vb,inner,cls)=>`<svg class="cat ${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
function catSVG(kind='sit'){
  switch(kind){
    case 'wave':  return svgWrap('0 0 120 150',catBody('wave')+catHead('open','open'),'cat-wave');
    case 'cheer': return svgWrap('0 0 120 150',catBody('cheer')+catHead('happy','open'),'cat-cheer');
    case 'peek':  return svgWrap('0 0 120 104',catHead('happy','open')+`<ellipse cx="38" cy="96" rx="13" ry="8.5" fill="${CO}"/><ellipse cx="82" cy="96" rx="13" ry="8.5" fill="${CO}"/><path d="M33 98v-4M38 99v-4M43 98v-4M77 98v-4M82 99v-4M87 98v-4" stroke="${CD}" stroke-width="1.6" stroke-linecap="round"/>`,'cat-peek');
    case 'face':  return svgWrap('0 0 120 100',catHead('open','smile'),'cat-face');
    case 'sleep': return svgWrap('0 0 170 112',catSleeping()+zzz,'cat-sleep');
    case 'blanket': return svgWrap('0 0 170 112',catSleeping()+
      `<path d="M56 70q50-18 108-1v26q-54 15-108 1z" fill="#C9B6F2"/>
       <path d="M56 70q50-18 108-1" fill="none" stroke="#9B7EDE" stroke-width="3" stroke-linecap="round"/>
       <g fill="#fff" opacity=".75"><circle cx="78" cy="82" r="2.4"/><circle cx="100" cy="76" r="2.4"/><circle cx="122" cy="80" r="2.4"/><circle cx="144" cy="78" r="2.4"/><circle cx="90" cy="92" r="2"/><circle cx="134" cy="91" r="2"/></g>
       <g transform="translate(124 30) rotate(14)"><rect x="0" y="7" width="26" height="30" rx="9" fill="#F8D7E3" stroke="#7A1F3D" stroke-width="2"/><rect x="8" y="0" width="10" height="9" rx="2" fill="#7A1F3D"/><path d="M13 28.5l-4.6-4.6a2.9 2.9 0 0 1 4.6-3.6 2.9 2.9 0 0 1 4.6 3.6z" fill="#7A1F3D"/></g>`+zzz,'cat-blanket');
    default:      return svgWrap('0 0 120 150',catBody('')+catHead('open','smile'),'cat-sit');
  }
}
function empty(line='Nothing here yet... time for a nap 💤',small=false){
  return `<div class="empty ${small?'small':''}">${catSVG('sleep')}<p>${esc(line)}</p></div>`;

/* =========================================================

    <circle cx="20" cy="20" r="${r}" fill="none" stroke="${fg}" stroke-opacity=".22" stroke-width="4.5"/>
    ${p>0?`<circle cx="20" cy="20" r="${r}" fill="none" stroke="${fg}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-p)).toFixed(2)}" transform="rotate(-90 20 20)"/>`:''}
    <text x="20" y="20.5" text-anchor="middle" dominant-baseline="middle" font-size="${pct===100?8.5:10}" font-weight="800" fill="${fg}" font-family="ui-rounded,system-ui,sans-serif">${pct}%</text></svg>`;
}
function checkBtn(on,act,id){
  return `<button class="check ${on?'on':''}" role="checkbox" aria-checked="${on}" aria-label="${on?'Mark as not done':'Mark as done'}" data-act="${act}" data-id="${id}"><span>${I.paw}</span></button>`;
}
function classById(id){ return S.classes.find(c=>c.id===id) || {id, name:'Unknown class', color:'#D5D9E6'}; }
function classStats(cid){
  const l=S.assignments.filter(a=>a.classId===cid), done=l.filter(a=>a.done).length;
  return {total:l.length, done, open:l.length-done};
}
function sortAssignments(l){
  return l.slice().sort((a,b)=>(a.done-b.done) || (a.done?cmp(b.due,a.due):cmp(a.due||'9999',b.due||'9999')) || a.createdAt-b.createdAt);
}
function todoSort(a,b){
  if(a.due&&b.due) return cmp(a.due,b.due)||a.createdAt-b.createdAt;
  if(a.due) return -1; if(b.due) return 1;
  return a.createdAt-b.createdAt;
}

/* =========================================================
   13. CYCLE TRACKER — calculations
   Periods = runs of logged period days (a 1-day gap is bridged).
   Cycle length = start-to-start; values outside 15–60 days are
   ignored as logging gaps. Averages use the last 6 values.
   ========================================================= */
function periodGroups(){
  const days=Object.keys(S.cycle.periods).sort(), groups=[];
  for(const d of days){
    const g=groups[groups.length-1];
    if(g&&diffDays(d,g.end)<=2) g.end=d; else groups.push({start:d,end:d});
  }
  groups.forEach(g=>g.length=diffDays(g.end,g.start)+1);
  return groups;
}
function cycleStats(){
  const groups=periodGroups(); if(!groups.length) return null;
  const t=todayStr();
  const lens=[];
  for(let i=1;i<groups.length;i++){ const L=diffDays(groups[i].start,groups[i-1].start); if(L>=15&&L<=60) lens.push(L); }
  const recent=lens.slice(-6);
  const cycleEst=recent.length<2, avgCycle=cycleEst?DEFAULT_CYCLE:Math.round(avg(recent));
  const finished=groups.filter(g=>diffDays(t,g.end)>=2).map(g=>g.length).filter(l=>l<=12).slice(-6);
  const periodEst=finished.length<2, avgPeriod=periodEst?DEFAULT_PERIOD:Math.max(1,Math.round(avg(finished)));
  const last=groups[groups.length-1];
  const cycleDay=diffDays(t,last.start)+1;
  const next=addDays(last.start,avgCycle);
  return {groups,avgCycle,avgPeriod,cycleEst,periodEst,last,cycleDay,next,
    daysToNext:diffDays(next,t), inPeriod:!!S.cycle.periods[t], stale:cycleDay>avgCycle+30};
}
function predictedDates(st){
  const set=new Set(); if(!st||st.stale) return set;
  const t=todayStr();
  if(st.inPeriod) for(let i=st.last.length;i<st.avgPeriod;i++){ const d=addDays(st.last.start,i); if(d>t&&!S.cycle.periods[d]) set.add(d); }
  let start=st.next<t?t:st.next;          // if late, the window starts "now"
  for(let k=0;k<3;k++){
    for(let i=0;i<st.avgPeriod;i++){ const d=addDays(start,i); if(!S.cycle.periods[d]) set.add(d); }
    start=addDays(start,st.avgCycle);
  }
  return set;
}
function nextText(st,short=false){
  const d=st.daysToNext, when=fmtDate(st.next,{weekday:'short',month:'short',day:'numeric'});
  if(short){
    if(d>1) return `next period in ~${d} days`;
    if(d===1) return 'next period ~tomorrow';
    if(d===0) return 'period expected ~today';
    return `period ~${plural(-d,'day')} late`;
  }
  if(st.inPeriod) return `Next period around ${when}`;
  if(d>1) return `Next period in ~${d} days · ${when}`;
  if(d===1) return `Next period expected ~tomorrow`;
  if(d===0) return `Period expected ~today`;
  return `About ${plural(-d,'day')} late (expected ${when})`;
}
function cycleLine(st){
  if(!st) return '';
  if(st.stale) return 'Cycle · tap to log your latest period';
  if(st.inPeriod) return `Period · day ${diffDays(todayStr(),st.last.start)+1}`;
  return `Day ${st.cycleDay} of cycle · ${nextText(st,true)}`;
}
function cycleHistory(st){
  const g=st.groups, out=[], t=todayStr();
  for(let i=g.length-1;i>=0&&out.length<12;i--){
    const cur=g[i], nxt=g[i+1], end=nxt?addDays(nxt.start,-1):t, counts={};
    for(const [ds,log] of Object.entries(S.cycle.logs)) if(ds>=cur.start&&ds<=end) log.symptoms.forEach(s=>counts[s]=(counts[s]||0)+1);
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>SYM_LABEL[k]);
    out.push({start:cur.start,cycleLen:nxt?diffDays(nxt.start,cur.start):null,periodLen:cur.length,top});
  }
  return out;
}
function cycLog(ds){ return S.cycle.logs[ds]||(S.cycle.logs[ds]={symptoms:[],other:'',mood:''}); }
function cleanLog(ds){ const l=S.cycle.logs[ds]; if(l&&!l.symptoms.length&&!l.other.trim()&&!l.mood) delete S.cycle.logs[ds]; }

let toastTimer;
function toast(msg,actLabel,action){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${actLabel?`<button type="button">${esc(actLabel)}</button>`:''}`;
  if(actLabel) $('button',t).onclick=()=>{ t.classList.remove('show'); action(); };
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),actLabel?5500:2800);
}
function confirmBox(title,msg,okLabel='OK',danger=false){
  return new Promise(res=>{
    const w=$('#confirm');
    w.innerHTML=`<div class="cf-box" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="cf-actions"><button class="btn ghost" data-cf="0">Cancel</button><button class="btn ${danger?'danger-fill':''}" data-cf="1">${esc(okLabel)}</button></div></div>`;
    w.classList.add('open');
    w.onclick=e=>{
      const b=e.target.closest('[data-cf]');
      if(!b&&e.target!==w) return;
      w.classList.remove('open'); w.onclick=null; res(!!b&&b.dataset.cf==='1');
    };
  });
}
function syncLock(){
  const any=$$('.overlay.open').length||$('#sheetWrap').classList.contains('open')||$('#onboard').classList.contains('open');
  document.body.classList.toggle('locked',!!any);
}
function openSheet(html,onMount){

/* =========================================================
   17. BACKUP: export (share sheet → Files, or download) / import
   ========================================================= */
async function exportBackup(){
  flushAll();
  const date=todayStr();
  const payload={app:'studyapp',version:1,exportedAt:new Date().toISOString(),data:{
    classes:S.classes,assignments:S.assignments,todos:S.todos,notes:S.notes,dayNotes:S.dayNotes,cycle:S.cycle,
    settings:{...S.settings,lastBackup:date}}};
  const json=JSON.stringify(payload,null,1), name=`ari-space-backup-${date}.json`;
  let ok=false;
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Ari's Space backup"}); ok=true; }
  }catch(e){ if(e&&e.name==='AbortError'){ toast('Backup cancelled'); return; } }
  if(!ok){
    try{
      const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),15000); ok=true;
    }catch(e){ toast('Export failed 😿 Try again'); return; }
  }
  S.settings.lastBackup=date; save('settings'); refresh();
  toast('Backup ready 🐾 Keep it in Files or iCloud Drive');
}
async function handleImport(file){
  let payload;
  try{ payload=JSON.parse(await file.text()); }catch(e){ toast("That file isn't a valid backup 😿"); return; }
  if(!isObj(payload)||payload.app!=='studyapp'||!isObj(payload.data)){ toast("That file isn't an Ari's Space backup"); return; }
  const d=payload.data, classes=SAN.classes(d.classes);
  if(classes.length!==4){ toast('This backup is missing class info 😿'); return; }
  const dt=new Date(payload.exportedAt);
  const when=isNaN(dt)?'an unknown date':dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const ok=await confirmBox('Restore backup?',`This replaces everything currently in the app with the backup from ${when}. This can't be undone.`,'Restore',true);
  if(!ok) return;
  flushAll();
  S.classes=classes;
  ['assignments','todos','notes','dayNotes','cycle','settings'].forEach(k=>S[k]=SAN[k](d[k]));
  S.settings.onboarded=true;
  KEYS.forEach(save);
  UI.classId=null;
  $('#onboard').classList.remove('open'); syncLock();
  refresh(); toast('Backup restored 🐾');
}

    let a, wasDone=false;
    if(el.dataset.id){
      a=S.assignments.find(x=>x.id===el.dataset.id); if(!a) return closeSheet();
      wasDone=a.done; Object.assign(a,{title,due,desc,classId});
      const dn=$('#f_done',sh); if(dn) a.done=dn.checked;
    }else{
      a={id:uid(),classId,title,due,desc,done:false,createdAt:Date.now()}; S.assignments.push(a);
    }
    save('assignments'); closeSheet(); refresh();
    if(a.done&&!wasDone){ if(completesClass(a)) setTimeout(()=>celebrate(classById(a.classId)),350); else catPop(); }
  },
  deleteAssignment:el=>{ closeSheet(); deleteWithUndo('assignments',el.dataset.id,'Assignment'); },
  toggleAssign:btn=>{
    const a=S.assignments.find(x=>x.id===btn.dataset.id); if(!a||btn.classList.contains('pop')) return;
    if(!a.done){
      const big=completesClass(a);
      btn.classList.add('on','pop'); const row=btn.closest('.item'); if(row) row.classList.add('leaving');
      if(!big) catPop();
      setTimeout(()=>{ a.done=true; save('assignments'); refresh(); if(big) celebrate(classById(a.classId)); },420);
    }else{ a.done=false; save('assignments'); refresh(); }
  },

  // notes
  newNote:el=>openNote(null,el.dataset.class||null),
  openNote:el=>openNote(el.dataset.id),
  closeNote:()=>{
    flushAll(); persistNote();
    const ed=UI.editing;
    if(ed&&ed.id){ const n=S.notes.find(x=>x.id===ed.id); if(n&&!n.title.trim()&&!n.body.trim()){ S.notes=S.notes.filter(x=>x!==n); save('notes'); } }
    UI.editing=null; if(document.activeElement) document.activeElement.blur();
    closeOverlay('editor'); renderMain();
  },
  deleteNote:()=>{
    flushAll(); persistNote();
    const ed=UI.editing; UI.editing=null;
    if(document.activeElement) document.activeElement.blur();
    closeOverlay('editor');
    if(ed&&ed.id) deleteWithUndo('notes',ed.id,'Note'); else renderMain();
  },

  // cycle
  cycShift:el=>{ shiftMonth('cyc',+el.dataset.k); renderCycle(); },
  cycToday:()=>{ const t=todayStr(); UI.cycY=+t.slice(0,4); UI.cycM=+t.slice(5,7)-1; renderCycle(); },
  cycDay:el=>openCycleDay(el.dataset.date),
  setFlow:el=>{
    const ds=el.dataset.date, f=el.dataset.flow; if(ds>todayStr()) return;
    if(f) S.cycle.periods[ds]=f; else delete S.cycle.periods[ds];
    save('cycle'); $$('#sheet .seg.flow button').forEach(b=>b.classList.toggle('sel',b===el)); renderCycle();
  },
  toggleSym:el=>{
    const ds=el.dataset.date, s=el.dataset.sym, l=cycLog(ds), i=l.symptoms.indexOf(s);
    if(i>=0) l.symptoms.splice(i,1); else l.symptoms.push(s);
    cleanLog(ds); save('cycle'); el.classList.toggle('sel',i<0); renderCycle();
  },
  setMood:el=>{
    const ds=el.dataset.date, l=cycLog(ds); l.mood=l.mood===el.dataset.mood?'':el.dataset.mood;
    cleanLog(ds); save('cycle'); $$('#sheet .mood').forEach(b=>b.classList.toggle('sel',b.dataset.mood===l.mood)); renderCycle();
  },

  // onboarding
  obColor:el=>{ $$(`.swatches[data-row="${el.dataset.row}"] .sw`).forEach(b=>b.classList.toggle('sel',b===el)); },
  obDone:()=>{
    const classes=[]; let bad=false;
    for(let i=0;i<4;i++){
      const inp=$('#ob_name_'+i), name=inp.value.trim();
      if(!name){ flagField(inp); bad=true; }
      const sel=$(`.swatches[data-row="${i}"] .sw.sel`);
      classes.push({id:'c'+(i+1),name,color:sel?sel.dataset.color:DEFAULT_CLASS_COLORS[i]});
    }
    if(bad){ toast('Give each class a name 🐾'); return; }
    S.classes=classes; S.settings.onboarded=true; save('classes'); save('settings');
    if(document.activeElement) document.activeElement.blur();
    $('#onboard').classList.remove('open'); syncLock();
    UI.tab='home'; renderMain(); setTimeout(catPop,450);
  },

  // settings
  setClassColor:el=>{ const c=S.classes.find(x=>x.id===el.dataset.id); if(!c) return; c.color=el.dataset.color; save('classes'); renderSettings(); },
  setWeekStart:el=>{ S.settings.weekStart=+el.dataset.v===0?0:1; save('settings'); renderSettings(); },
  newSemester:async()=>{
    const ok=await confirmBox('Start a new semester?','This deletes ALL assignments and class notes. Export a backup first if you might want them later.','Clear',true);
    if(!ok) return;
    S.assignments=[]; S.notes=S.notes.filter(n=>!n.classId); save('assignments'); save('notes');
    refresh(); toast('Fresh start! 🐾 Rename your classes above.');
  },
};
const CH = { // delegated change handlers: data-change="name"
  toggleCats:el=>{ S.settings.catAnimations=el.checked; save('settings'); if(el.checked) catPop(); },
};

/* =========================================================
   19. RENDERING & NAVIGATION
   ========================================================= */
const TABS=[['home','Home',I.home],['todo','To-Do',I.todo],['calendar','Calendar',I.cal],['classes','Classes',I.classes],['notes','Notes',I.notes]];
function renderTabbar(){
  $('#tabbar').innerHTML=TABS.map(([id,label,icon])=>`<button class="tab ${UI.tab===id?'active':''}" data-act="tab" data-tab="${id}" aria-label="${label}" ${UI.tab===id?'aria-current="page"':''}><span class="tab-ic">${icon}</span>${label}</button>`).join('');
}
function renderMain(){
  if(S.classes.length!==4) return;
  flushAll();
  const fn={home:renderHome,todo:renderTodo,calendar:renderCalendar,classes:renderClasses,notes:renderNotes}[UI.tab]||renderHome;
  $('#view').innerHTML=fn();
  if(UI.tab==='todo') bindTodo();
  if(UI.tab==='calendar') bindCalendar();
  if(UI.tab==='notes') bindNotes();
  renderTabbar();
}
function bindTodo(){
  bindDatePills($('#view'));
  $('#todoForm').addEventListener('submit',e=>{
    e.preventDefault();
    const ti=$('#todoText'), txt=ti.value.trim(); if(!txt) return flagField(ti);
    const due=$('#todoDue').value;
    S.todos.push({id:uid(),text:txt,due:isValidYmd(due)?due:'',done:false,createdAt:Date.now(),doneAt:0});
    save('todos'); renderMain();
    const ni=$('#todoText'); if(ni) ni.focus({preventScroll:true});
  });
}
/** Re-render everything visible (main view + open overlays that show data). */
function refresh(){
  renderMain();
  if($('#cycle').classList.contains('open')) renderCycle();
  if($('#settings').classList.contains('open')) renderSettings();
}
function switchTab(tab){
  if(UI.tab===tab){ window.scrollTo({top:0,behavior:'smooth'}); if(tab!=='home') return; }
  UI.tab=tab; renderMain(); window.scrollTo(0,0);
  const v=$('#view'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
}

/* =========================================================
   20. INIT & GLOBAL LISTENERS
   ========================================================= */
function updateViewport(){
  const vv=window.visualViewport; if(!vv) return;
  const r=document.documentElement.style;
  r.setProperty('--vvh',vv.height+'px');
  r.setProperty('--vvt',vv.offsetTop+'px');
  r.setProperty('--kb',Math.max(0,window.innerHeight-vv.height-vv.offsetTop)+'px');
}
let lastDay='';
function checkDayChange(){
  const t=todayStr(); if(t===lastDay) return;
  lastDay=t; UI.greeting=null;
  const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(!typing) refresh();
}
function init(){
  KEYS.forEach(k=>{ try{ S[k]=load(k); }catch(e){ S[k]=SAN[k](undefined); } });
  const t=todayStr(); lastDay=t;
  UI.calY=+t.slice(0,4); UI.calM=+t.slice(5,7)-1; UI.calSel=t; UI.cycY=UI.calY; UI.cycM=UI.calM;

  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]'); if(!el) return;
    const fn=A[el.dataset.act]; if(!fn) return;
    e.preventDefault();
    try{ fn(el,e); }catch(err){ console.error(err); toast('Oops, something hiccuped 😿 Your data is safe.'); }
  });
  document.addEventListener('change',e=>{
    const el=e.target.closest('[data-change]'); if(el&&CH[el.dataset.change]) CH[el.dataset.change](el,e);
  });
  $('#importFile').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) handleImport(f); });
  if(window.visualViewport){ visualViewport.addEventListener('resize',updateViewport); visualViewport.addEventListener('scroll',updateViewport); }
  updateViewport();
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushAll(); else checkDayChange(); });
  window.addEventListener('pagehide',flushAll);
  setInterval(checkDayChange,60e3);

  // Ask iOS/Safari to treat this storage as persistent (best effort, no-op where unsupported).
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

  if(!S.settings.onboarded||S.classes.length!==4) renderOnboarding();
  else renderMain();
}
init();
</script>
